<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>业务管理账号</title>
<style>body{font:16px system-ui;max-width:440px;margin:8vh auto;padding:24px;background:#f5f7fa;color:#152235}form{background:white;padding:24px;border-radius:12px}label{display:block;margin:12px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{background:#225bce;color:white;border:0;border-radius:6px}#status{white-space:pre-wrap}a{color:#225bce}</style>
<h1>业务管理账号</h1><p>使用个人业务账号登录。首次登录须修改初始密码；修改后请重新登录。</p>
<form id="login"><label>账号<input name="username" autocomplete="username" required maxlength="150"></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<form id="password" hidden><label>新密码<input name="new_password" type="password" autocomplete="new-password" required minlength="12"></label><label>再次输入新密码<input name="confirm_password" type="password" autocomplete="new-password" required minlength="12"></label><button>修改初始密码</button></form>
<p id="status" role="status"></p><p><a href="/admin/">打开业务管理后台</a></p>
<script>
const loginForm=document.querySelector('#login'),passwordForm=document.querySelector('#password'),status=document.querySelector('#status');
async function call(path,body){const csrf=await fetch('/api/csrf/',{credentials:'same-origin',cache:'no-store'});if(!csrf.ok)throw Error('无法获取安全校验，请刷新重试。');const token=(await csrf.json()).csrfToken;const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.detail||'请求失败，请重试。');return data;}
async function submit(form,path,onSuccess){const button=form.querySelector('button');button.disabled=true;status.textContent='处理中…';try{await onSuccess(await call(path,Object.fromEntries(new FormData(form))));form.reset();}catch(error){status.textContent=error.message;}finally{button.disabled=false;}}
loginForm.onsubmit=event=>{event.preventDefault();submit(loginForm,'/api/login/',data=>{if(data.must_change_password){loginForm.hidden=true;passwordForm.hidden=false;status.textContent='请设置个人新密码。';}else if(data.is_platform_admin){location.assign('/admin/');}else{status.textContent='业务账号登录成功，请回到员工端继续工作。';}});};
passwordForm.onsubmit=event=>{event.preventDefault();submit(passwordForm,'/api/password/',data=>{passwordForm.hidden=true;loginForm.hidden=false;status.textContent=data.detail;});};
</script></html>
